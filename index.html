<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美股五层反转分析器 V2</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #0b0b0c;
      color: #f5f5f7;
    }

    .wrap {
      max-width: 820px;
      margin: auto;
      padding: 24px 16px 50px;
    }

    h1 {
      margin-bottom: 6px;
      font-size: 28px;
    }

    .subtitle {
      color: #9da0a6;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .search {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    input {
      flex: 1;
      padding: 14px;
      font-size: 18px;
      text-transform: uppercase;
      border-radius: 10px;
      border: 1px solid #333;
      background: #171719;
      color: white;
    }

    button {
      padding: 0 22px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #2f7cff;
      color: white;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .status {
      min-height: 24px;
      margin-bottom: 15px;
      color: #aaa;
    }

    .error {
      color: #ff7070;
    }

    .card {
      background: #171719;
      border: 1px solid #29292d;
      border-radius: 14px;
      padding: 18px;
      margin-top: 14px;
    }

    .hidden {
      display: none;
    }

    .headline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .symbol {
      font-size: 26px;
      font-weight: 800;
    }

    .score {
      font-size: 30px;
      font-weight: 800;
    }

    .verdict {
      margin-top: 8px;
      color: #b9bbc0;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 16px;
    }

    .metric {
      background: #111113;
      padding: 12px;
      border-radius: 10px;
    }

    .metric small {
      color: #888;
      display: block;
      margin-bottom: 5px;
    }

    .metric strong {
      font-size: 17px;
    }

    .layer {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 10px;
      padding: 15px 0;
      border-bottom: 1px solid #29292d;
    }

    .layer:last-child {
      border-bottom: 0;
    }

    .badge {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 800;
    }

    .pass {
      background: #123d25;
      color: #5ee28b;
    }

    .fail {
      background: #411b1b;
      color: #ff7777;
    }

    .layer-title {
      font-weight: 750;
      margin-bottom: 5px;
    }

    .detail {
      color: #aaa;
      line-height: 1.45;
      font-size: 14px;
    }

    .note {
      color: #777;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 20px;
    }

    @media (max-width: 600px) {
      .metrics {
        grid-template-columns: repeat(2, 1fr);
      }

      .search {
        flex-direction: column;
      }

      button {
        height: 48px;
      }
    }
  </style>
</head>

<body>

<div class="wrap">

  <h1>美股五层反转分析器</h1>

  <div class="subtitle">
    V2 · 输入美股代码，自动读取日线行情并计算五层反转信号
  </div>

  <div class="search">
    <input id="ticker" value="MCD" placeholder="例如 MCD / AAPL / MSFT">
    <button id="analyzeBtn">分析</button>
  </div>

  <div id="status" class="status"></div>

  <div id="result" class="hidden">

    <div class="card">
      <div class="headline">
        <div>
          <div id="symbol" class="symbol"></div>
          <div id="marketInfo" class="verdict"></div>
        </div>

        <div id="score" class="score"></div>
      </div>

      <div id="verdict" class="verdict"></div>

      <div class="metrics">
        <div class="metric">
          <small>收盘价</small>
          <strong id="close"></strong>
        </div>

        <div class="metric">
          <small>MA5</small>
          <strong id="ma5"></strong>
        </div>

        <div class="metric">
          <small>MA10</small>
          <strong id="ma10"></strong>
        </div>

        <div class="metric">
          <small>MA20</small>
          <strong id="ma20"></strong>
        </div>

        <div class="metric">
          <small>MA60</small>
          <strong id="ma60"></strong>
        </div>

        <div class="metric">
          <small>成交量 / 20日均量</small>
          <strong id="volumeRatio"></strong>
        </div>
      </div>
    </div>

    <div id="layers" class="card"></div>

    <div class="note">
      本工具使用规则化技术指标识别潜在反转信号，仅用于研究和筛选，
      不构成投资建议。盘中数据可能尚未形成完整日K线。
    </div>

  </div>

</div>

<script>
const API =
  "https://stock-reversal-api.cynthia-fan-138.workers.dev/";

const $ = id => document.getElementById(id);

function avg(arr) {
  return arr.reduce((a, b) => a + b, 0) / arr.length;
}

function sma(data, endIndex, period, field = "close") {
  const start = endIndex - period + 1;

  if (start < 0) return null;

  return avg(
    data.slice(start, endIndex + 1).map(x => x[field])
  );
}

function pct(n) {
  return (n * 100).toFixed(2) + "%";
}

function money(n) {
  return Number(n).toFixed(2);
}

function detectHammer(d) {
  const body = Math.abs(d.close - d.open);
  const range = d.high - d.low;

  if (range <= 0) return false;

  const lowerShadow =
    Math.min(d.open, d.close) - d.low;

  const upperShadow =
    d.high - Math.max(d.open, d.close);

  const effectiveBody = Math.max(body, range * 0.05);

  return (
    lowerShadow >= effectiveBody * 2 &&
    upperShadow <= effectiveBody &&
    Math.max(d.open, d.close) >= d.low + range * 0.6
  );
}

function detectBullishEngulfing(prev, cur) {
  return (
    prev.close < prev.open &&
    cur.close > cur.open &&
    cur.open <= prev.close &&
    cur.close >= prev.open
  );
}

function detectMorningStar(a, b, c) {
  const bodyA = Math.abs(a.close - a.open);
  const bodyB = Math.abs(b.close - b.open);

  const firstBearish = a.close < a.open;
  const thirdBullish = c.close > c.open;

  const smallMiddle =
    bodyB <= bodyA * 0.5;

  const midpointA =
    (a.open + a.close) / 2;

  return (
    firstBearish &&
    smallMiddle &&
    thirdBullish &&
    c.close > midpointA
  );
}

function verdict(score) {
  if (score >= 5) return "强反转候选";
  if (score >= 4) return "高度关注";
  if (score >= 2) return "开始观察";
  return "等待确认";
}

function layerHTML(pass, number, title, detail) {
  return `
    <div class="layer">
      <div class="badge ${pass ? "pass" : "fail"}">
        ${pass ? "✓" : "×"}
      </div>

      <div>
        <div class="layer-title">
          第${number}层 · ${title}
        </div>

        <div class="detail">
          ${detail}
        </div>
      </div>
    </div>
  `;
}

async function analyze() {

  const ticker =
    $("ticker").value.trim().toUpperCase();

  if (!ticker) return;

  $("analyzeBtn").disabled = true;
  $("status").className = "status";
  $("status").textContent = "正在读取行情并计算……";
  $("result").classList.add("hidden");

  try {

    const response =
      await fetch(API + "?symbol=" + encodeURIComponent(ticker));

    const data = await response.json();

    if (!response.ok || data.error) {
      throw new Error(
        data.error || "无法取得行情数据"
      );
    }

    const p = data.prices;

    if (!Array.isArray(p) || p.length < 65) {
      throw new Error("历史数据不足，无法计算 MA60。");
    }

    // Determine whether the newest daily bar is still today's intraday bar.
// If so, exclude it from the official reversal score.
const now = new Date();

const nyDate = new Intl.DateTimeFormat(
  "en-CA",
  {
    timeZone: "America/New_York",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }
).format(now);

const nyTime = new Intl.DateTimeFormat(
  "en-US",
  {
    timeZone: "America/New_York",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  }
).format(now);

const [hour, minute] =
  nyTime.split(":").map(Number);

const minutesNow =
  hour * 60 + minute;

// Normal US market close = 16:00 New York time.
// Add 15 minutes as a safety buffer for final daily-bar updates.
const marketDataComplete =
  minutesNow >= 16 * 60 + 15;

const latestBar = p[p.length - 1];

const latestIsToday =
  latestBar.date === nyDate;

const usingPriorClose =
  latestIsToday && !marketDataComplete;

// i is the bar used for the official five-layer score.
const i = usingPriorClose
  ? p.length - 2
  : p.length - 1;

const today = p[i];
const yesterday = p[i - 1];
const twoDaysAgo = p[i - 2];

    const ma5 = sma(p, i, 5);
    const ma10 = sma(p, i, 10);
    const ma20 = sma(p, i, 20);
    const ma60 = sma(p, i, 60);

    const ma5Prev = sma(p, i - 1, 5);
    const ma10Prev = sma(p, i - 1, 10);

    const ma5TwoDaysAgo =
      sma(p, i - 2, 5);

    const ma60FiveDaysAgo =
      sma(p, i - 5, 60);

    /*
      Average volume uses the PRIOR 20 completed bars,
      excluding the current bar.
    */
    const prior20Volumes =
      p.slice(i - 20, i).map(x => x.volume);

    const avgVol20 =
      avg(prior20Volumes);

    const volumeRatio =
      today.volume / avgVol20;

    // Layer 1
    const priceAboveMA60 =
      today.close > ma60;

    const ma60Rising =
      ma60 > ma60FiveDaysAgo;

    const layer1 =
      priceAboveMA60 && ma60Rising;

    // Layer 2
    const ma5Rising =
      ma5 > ma5Prev &&
      ma5Prev > ma5TwoDaysAgo;

    const bullishCross =
      ma5 > ma10 &&
      ma5Prev <= ma10Prev;

    const layer2 =
      ma5Rising && bullishCross;

    // Layer 3
    const highVolume =
      volumeRatio >= 1.5;

    const aboveMA20 =
      today.close > ma20;

    const layer3 =
      highVolume && aboveMA20;

    // Layer 4
    const hammer =
      detectHammer(today);

    const engulfing =
      detectBullishEngulfing(
        yesterday,
        today
      );

    const morningStar =
      detectMorningStar(
        twoDaysAgo,
        yesterday,
        today
      );

    const layer4 =
      hammer || engulfing || morningStar;

    let patternText = "未识别到指定反转K线";

    if (hammer)
      patternText = "锤头形态";

    if (engulfing)
      patternText = "看涨吞没";

    if (morningStar)
      patternText = "Morning Star";

    // Layer 5
    /*
      Latest three lows must not make a new low
      versus the low immediately preceding them.
    */
    const referenceLow =
      p[i - 3].low;

    const noNewLow =
      p[i - 2].low >= referenceLow &&
      p[i - 1].low >= referenceLow &&
      p[i].low >= referenceLow;

    const bullishBody =
      today.close > today.open &&
      (today.close - today.open) /
        today.open >= 0.02;

    const layer5 =
      noNewLow &&
      bullishBody &&
      highVolume;

    const layers = [
      layer1,
      layer2,
      layer3,
      layer4,
      layer5
    ];

    const score =
      layers.filter(Boolean).length;

    $("symbol").textContent =
      data.symbol;

   $("marketInfo").innerHTML =
  usingPriorClose
    ? `${data.exchange || "US"} · 正式评分基于 ${today.date} 收盘<br>
       <span style="color:#e5b85c">
         盘中参考：${latestBar.date} · $${money(latestBar.close)}
       </span>`
    : `${data.exchange || "US"} · 正式评分基于 ${today.date} 收盘`;

    $("score").textContent =
      `${score}/5`;

    $("verdict").textContent =
      verdict(score);

    $("close").textContent =
      "$" + money(today.close);

    $("ma5").textContent =
      money(ma5);

    $("ma10").textContent =
      money(ma10);

    $("ma20").textContent =
      money(ma20);

    $("ma60").textContent =
      money(ma60);

    $("volumeRatio").textContent =
      volumeRatio.toFixed(2) + "×";

    $("layers").innerHTML =

      layerHTML(
        layer1,
        1,
        "长期趋势",
        `收盘 ${money(today.close)} ${priceAboveMA60 ? ">" : "≤"} MA60 ${money(ma60)}；
         MA60 ${ma60Rising ? "向上" : "尚未向上"}`
      )

      +

      layerHTML(
        layer2,
        2,
        "短期均线转强",
        `MA5 ${ma5Rising ? "连续走高" : "未连续走高"}；
         ${bullishCross ? "今日上穿 MA10" : "今日没有形成 MA5 上穿 MA10"}`
      )

      +

      layerHTML(
        layer3,
        3,
        "放量突破",
        `成交量为过去20日均量的 ${volumeRatio.toFixed(2)}×；
         收盘 ${aboveMA20 ? "高于" : "未高于"} MA20`
      )

      +

      layerHTML(
        layer4,
        4,
        "反转K线",
        patternText
      )

      +

      layerHTML(
        layer5,
        5,
        "三日确认",
        `三日${noNewLow ? "未创新低" : "出现新低"}；
         今日阳线实体 ${pct((today.close - today.open) / today.open)}；
         成交量 ${highVolume ? "达到" : "未达到"} 1.5×`
      );

    $("status").textContent =
      `已读取 ${p.length} 个交易日数据`;

    $("result").classList.remove("hidden");

  } catch (err) {

    $("status").className =
      "status error";

    $("status").textContent =
      "分析失败：" + err.message;

  } finally {

    $("analyzeBtn").disabled = false;

  }
}

$("analyzeBtn").addEventListener(
  "click",
  analyze
);

$("ticker").addEventListener(
  "keydown",
  e => {
    if (e.key === "Enter") analyze();
  }
);
</script>

</body>
</html>
